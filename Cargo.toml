[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
directories = "6"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
