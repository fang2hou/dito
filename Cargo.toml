[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
directories = "6"
time = "0.3"
tokio-util = "0.7"
base64 = "0.22"
libc = "0.2"
tempfile = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.local]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
