name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  verify:
    name: Verify the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install: false
      - name: Check the tag matches the version and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: mise run ci:release-tag

  publish:
    name: Publish the draft release
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install the Rust toolchain (mise)
        uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: Build the app bundle
        run: mise run bundle
      - name: Archive the app bundle
        env:
          TAG: ${{ github.ref_name }}
        run: ditto -c -k --keepParent target/bundle/Dito.app "Dito-${TAG}-macos-arm64.zip"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "Dito-${TAG}-macos-arm64.zip" --draft --verify-tag --generate-notes --title "$TAG"
