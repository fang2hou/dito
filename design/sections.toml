# Semantic ids for the sections of design/dito.figcraft.
#
# Code, docs and skills refer to a section as `design:<id>`; only this file knows its number. When the design is
# renumbered, edit `board` here and run `scripts/check-design-refs.py`. `item` is set when the id names a numbered
# item inside the board. Layer names are quoted from the saved file; an empty `layer` means the number was cited but
# no layer carries it as a name.

# Pages
[foundations]
board = "10"
layer = "Color"
page = true

[components]
board = "11"
layer = "Type, Space & Components"
page = true

[motion]
