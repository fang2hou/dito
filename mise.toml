[tools]
python = "3.15.2"
uv = "0.13.7"
rust = { version = "1.99.1", profile = "minimal", components = "rustfmt,clippy,rust-analyzer" }
ruff = "0.17.3"
ty = "0.0.97"
cocogitto = "7.0.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
prek = "0.5.10"
gitleaks = "8.30.1"

[env]
UV_PYTHON_DOWNLOADS = "never"

[tasks.dev]
description = "Run the app against real microphone, models and providers (debug build)"
run = "cargo run -p dito-app -- --open-settings"

[tasks."dev:mock"]
description = "Run the app with mock cloud, microphone and data; never types into other apps"
run = "cargo run -p dito-app --features mock -- --mock --log-sink --open-settings"

[tasks.bundle]
description = "Build the optimized release bundle at target/bundle/Dito.app"
run = "scripts/bundle.sh"

[tasks.release]
description = "Build the optimized release bundle and launch it"
depends = ["bundle"]
run = ["scripts/quit.sh", "open target/bundle/Dito.app"]

[tasks."release:install"]
description = "Build the release bundle and install it to ~/Applications, creating the signing identity if needed"
run = "scripts/install.sh"

[tasks.check]
description = "Format check and fast tests"
run = "scripts/check.sh fast"

[tasks."check:full"]
description = "Fast checks plus compile checks of every build flavor"
run = "scripts/check.sh full"

[tasks.lint]
description = "Clippy for the workspace, ruff and ty for bench, and actionlint for workflows"
depends = ["lint:rust", "bench:lint", "lint:actions"]

[tasks."lint:rust"]
description = "Clippy over the whole workspace, then again with the mock and screenshots features"
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo clippy --workspace --all-targets --features dito-app/mock,dito-app/screenshots -- -D warnings",
]

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.format]
description = "Format Rust and Python sources"
depends = ["format:rust", "bench:format"]

[tasks."format:rust"]
description = "Format the Rust workspace"
run = "cargo fmt --all"

[tasks.certs]
description = "Create the local dito-dev code-signing identity if it is missing"
run = "scripts/certs.sh"

[tasks."setup:macos"]
description = "Install the Xcode Metal Toolchain if it is missing"
run = "scripts/setup-macos.sh"

[tasks."hooks:install"]
description = "Install the prek Git hooks (pre-commit and commit-msg) into this clone"
run = "prek install --hook-type pre-commit --hook-type commit-msg --overwrite"

[tasks.hooks]
description = "Run every prek hook against all files"
run = "prek run --all-files"

[tasks."hooks:commit-msg"]
description = "Check a commit message file follows Conventional Commits (used by the commit-msg hook)"
run = "cog verify --ignore-merge-commits --ignore-fixup-commits --file"

[tasks."ci:flow"]
description = "Check a pull request against the Git Flow branch rules (HEAD_REF, BASE_REF)"
run = "scripts/check-flow.sh"

[tasks."ci:pr-title"]
description = "Check that PR_TITLE follows Conventional Commits"
run = 'cog verify "$PR_TITLE"'

[tasks."ci:release-tag"]
description = "Check that TAG matches the workspace version and is on main"
run = "scripts/check-release-tag.sh"

[tasks."bench:sync"]
description = "Install the bench Python environment with every runtime extra"
dir = "bench"
run = "uv sync --all-extras --all-groups"

[tasks."bench:lint"]
description = "Ruff lint, format check and type check for bench"
dir = "bench"
depends = ["bench:sync"]
run = ["ruff check .", "ruff format --check .", "ty check"]

[tasks."bench:test"]
description = "Run the bench unit tests"
dir = "bench"
depends = ["bench:sync"]
run = "uv run pytest"

[tasks."bench:check"]
description = "Lint, type check and test bench"
depends = ["bench:lint", "bench:test"]

[tasks."bench:format"]
description = "Format and autofix bench sources with ruff"
dir = "bench"
run = ["ruff check --fix .", "ruff format ."]

[tasks.bench]
description = "Run dito-bench, e.g. `mise run bench asr run -m sensevoice`"
dir = "bench"
depends = ["bench:sync"]
run = "uv run dito-bench"

[tasks."bench:notebook"]
description = "Open JupyterLab on the bench notebooks"
dir = "bench"
depends = ["bench:sync"]
run = "uv run jupyter lab notebooks"
