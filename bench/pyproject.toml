[project]
name = "dito-bench"
version = "0.1.0"
description = "Local benchmark harness for the speech recognition and polish models Dito can run."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "huggingface-hub>=1.0",
    "jiwer>=4.0",
    "numpy>=2.5",
    "soundfile>=0.14",
]

[project.optional-dependencies]
sherpa = ["sherpa-onnx>=2.0"]
mlx = ["mlx-lm>=0.32", "mlx-qwen3-asr>=0.4", "mlx-whisper>=0.4"]
llama = ["llama-cpp-python>=0.3.36"]
recording = ["sounddevice>=0.5"]
charts = ["matplotlib>=3.11"]

[project.scripts]
dito-bench = "dito_bench.cli:main"

[dependency-groups]
dev = ["pytest>=9.0"]
notebook = ["ipykernel>=7.4", "jupyterlab>=4.6", "pandas>=3.1"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM",
    "A", "ANN", "C4", "ERA", "N", "PERF", "PIE", "PT", "PTH", "RET", "RUF", "T20",
]

[tool.ruff.lint.per-file-ignores]
"src/dito_bench/cli.py" = ["T201"]
"src/dito_bench/recorder.py" = ["T201"]
"src/dito_bench/polish/prompts.py" = ["E501", "RUF001"]
"src/dito_bench/intent/prompts.py" = ["E501", "RUF001"]
"tests/*" = ["ANN"]
"notebooks/*" = ["T201", "ANN", "E402", "E501", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
