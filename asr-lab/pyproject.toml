[project]
name = "asr-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jiwer>=4.0.0",
    "jupyterlab>=4.6.4",
    "llama-cpp-python>=0.3.36",
    "mlx-lm>=0.32.2",
    "mlx-qwen3-asr>=0.4.4",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "sherpa-onnx>=2.0.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
