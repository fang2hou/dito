[package]
name = "dito-runtimes"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["llama", "sherpa"]
# llama.cpp (GGUF language models, Metal)
llama = ["dep:llama-cpp-2", "dep:encoding_rs"]
# sherpa-onnx (SenseVoice speech recognition)
sherpa = ["dep:sherpa-rs"]

[dependencies]
dito-local = { path = "../dito-local" }
tracing.workspace = true
encoding_rs = { version = "0.8", optional = true }
llama-cpp-2 = { version = "0.1", optional = true, features = ["metal", "mtmd"] }
sherpa-rs = { version = "0.6", optional = true, default-features = false, features = ["download-binaries", "static"] }

[dev-dependencies]
dito-core = { path = "../dito-core" }
tokio.workspace = true
