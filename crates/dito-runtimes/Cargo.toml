[package]
name = "dito-runtimes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["llama", "sherpa", "transcribe", "nemo"]
llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:encoding_rs"]
sherpa = ["dep:sherpa-onnx-sys", "dep:serde_json"]
transcribe = ["dep:transcribe-cpp"]
nemo = ["dep:reqwest", "dep:tokio", "dep:base64", "dep:serde_json"]

[dependencies]
dito-core = { path = "../dito-core" }
dito-local = { path = "../dito-local" }
tracing.workspace = true
encoding_rs = { version = "0.8", optional = true }
llama-cpp-2 = { version = "=0.1.161", optional = true, features = ["metal", "mtmd"] }
llama-cpp-sys-2 = { version = "=0.1.161", optional = true }
sherpa-onnx-sys = { version = "=2.0.1", optional = true }
serde_json = { workspace = true, optional = true }
transcribe-cpp = { version = "=0.4.2", optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
dito-audio = { path = "../dito-audio" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true

[[example]]
name = "intent_probe"
required-features = ["llama"]

[[example]]
name = "intent_decide"
required-features = ["llama"]

[[example]]
name = "managed_asr_e2e"
required-features = ["nemo"]
