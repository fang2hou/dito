[package]
name = "dito-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dito-core = { path = "../dito-core" }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSURL", "NSObject", "NSEnumerator", "NSLocale", "NSData", "NSBundle", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSPanel", "NSScreen", "NSPasteboard", "NSImage", "NSAccessibility"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"
security-framework = "3"
arboard = "3"
libc = "0.2"
