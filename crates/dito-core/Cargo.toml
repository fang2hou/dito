[package]
name = "dito-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util = "0.7"
futures-util.workspace = true
axum = { version = "0.8", default-features = false, features = ["multipart", "json", "tokio", "http1"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-streamable-http-server"] }
reqwest.workspace = true
rusqlite.workspace = true
tracing.workspace = true
async-trait.workspace = true
directories.workspace = true
time.workspace = true
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-smithy-types = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"

[build-dependencies]
toml = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
