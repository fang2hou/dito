# --- parameterized messages (generated functions) ------------------------------
[fmt.using_model]
ja = "{model} を使用中"
en = "Using {model}"
zh = "正在使用 {model}"

[fmt.downloads_model]
ja = "約 {model} をダウンロードします"
en = "Downloads about {model}"
zh = "将下载约 {model}"

[fmt.needs_download_about]
ja = "約 {size} のダウンロードが必要です"
en = "Requires a ~{size} download"
zh = "需要下载约 {size}"

[fmt.press_key]
ja = "{key} を押す"
en = "Press {key}"
zh = "按下 {key}"

[fmt.hold_key]
ja = "{key} を押し続ける"
en = "Hold {key}"
zh = "按住 {key}"

[fmt.about_seconds_left]
ja = "残り約 {n} 秒"
en = "about {n} s left"
zh = "剩余约 {n} 秒"

[fmt.about_minutes_left]
ja = "残り約 {n} 分"
en = "about {n} min left"
zh = "剩余约 {n} 分钟"

[fmt.remove_application_scope]
ja = "「{app}」の書き方、例、表示名を削除します。"
en = "Delete the writing rules, examples and display name for “{app}”."
zh = "将删除“{app}”的写法、范例和显示名。"

[fmt.reset_common_scope]
