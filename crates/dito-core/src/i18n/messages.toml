# Dito UI copy. One entry per message, all languages side by side.
#
# - The dotted key is the template ID; build.rs turns it into a `Tr` enum variant
#   (`nav.settings` -> `Tr::NavSettings`) and embeds every language at compile time.
# - ja/en/zh are all required. An empty value or a language that forgets a placeholder
#   fails the build.
# - Placeholders are named (`{model}`), never positional `{}`; entries with placeholders
#   also get a generated formatting function (`i18n::using_model(lang, &name)`) and live
#   under `fmt.`, where a literal brace is doubled (`{{`, `}}`) as in `format!`. All other
#   copy is shown as written, so its braces are literal text; a bare `{name}` there fails
#   the build, since it is a placeholder outside `fmt.`.
# - Adding a language: add the column here and one match arm in build.rs's LANGS.

