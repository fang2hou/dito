[package]
name = "dito-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "dito"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["runtimes"]
runtimes = ["dep:dito-runtimes"]
mock = ["dep:dito-testkit"]
screenshots = ["mock", "gpui-kit/test-support", "dito-ui/screenshots", "dep:image"]

[dependencies]
serde_json.workspace = true
dito-core = { path = "../dito-core" }
dito-audio = { path = "../dito-audio" }
dito-local = { path = "../dito-local" }
dito-platform = { path = "../dito-platform" }
dito-runtimes = { path = "../dito-runtimes", optional = true }
dito-testkit = { path = "../dito-testkit", optional = true }
dito-ui = { path = "../dito-ui" }
gpui-kit.workspace = true
raw-window-handle = "0.6"
pulldown-cmark = { version = "0.13", default-features = false }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rust-embed = "8"
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
time.workspace = true
